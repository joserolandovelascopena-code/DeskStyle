<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Verificando acceso...</title>

    <link
      rel="shortcut icon"
      href="../../icons/favicon.png"
      type="image/x-icon"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
    />

    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root {
        --bg: #fbfdff;
        --colorPrimario: #000418;
        --colorSecundario: #ff8900;
        --colorSucces: #28a745;
        --colorError: #dc3545;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        font-family: "Inter", sans-serif;
      }

      body {
        background: var(--bg);
        color: var(--colorPrimario);
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: none;
      }
      .loader {
        height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(245, 245, 247, 0.58);
        backdrop-filter: blur(14px) saturate(120%);
        -webkit-backdrop-filter: blur(14px) saturate(120%);

        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
      }

      .cont_loader {
        display: flex;
        align-items: center;
        justify-content: center;

        animation: loaderAppear 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .loader_box {
        min-width: 190px;
        padding: 24px 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.8);

        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.1),
          0 4px 16px rgba(0, 0, 0, 0.05);

        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      /*  SPINNER */

      .spinner {
        display: block;
        position: relative;
        width: 42px;
        height: 42px;
        margin-bottom: 17px;
        animation: spinnerRotate 1.2s linear infinite;
      }

      /* Segmentos */

      .spinner span {
        position: absolute;
        top: 0;
        left: 50%;
        width: 4px;
        height: 11px;
        margin-left: -2px;
        border-radius: 999px;
        background: var(--colorPrimario);
        transform-origin: 2px 21px;
        opacity: 0;
        animation: spinnerFade 1.2s linear infinite;
      }

      /* Posiciones */

      .spinner span:nth-child(1) {
        transform: rotate(0deg);
        animation-delay: 0s;
      }

      .spinner span:nth-child(2) {
        transform: rotate(30deg);
        animation-delay: -0.1s;
      }

      .spinner span:nth-child(3) {
        transform: rotate(60deg);
        animation-delay: -0.2s;
      }

      .spinner span:nth-child(4) {
        transform: rotate(90deg);
        animation-delay: -0.3s;
      }

      .spinner span:nth-child(5) {
        transform: rotate(120deg);
        animation-delay: -0.4s;
      }

      .spinner span:nth-child(6) {
        transform: rotate(150deg);
        animation-delay: -0.5s;
      }

      .spinner span:nth-child(7) {
        transform: rotate(180deg);
        animation-delay: -0.6s;
      }

      .spinner span:nth-child(8) {
        transform: rotate(210deg);
        animation-delay: -0.7s;
      }

      .spinner span:nth-child(9) {
        transform: rotate(240deg);
        animation-delay: -0.8s;
      }

      .spinner span:nth-child(10) {
        transform: rotate(270deg);
        animation-delay: -0.9s;
      }

      .spinner span:nth-child(11) {
        transform: rotate(300deg);
        animation-delay: -1s;
      }

      .spinner span:nth-child(12) {
        transform: rotate(330deg);
        animation-delay: -1.1s;
      }

      .loader_text {
        display: flex;
        flex-direction: column;
        align-items: center;

        text-align: center;

        line-height: 1.3;
      }

      .loader_text strong {
        font-size: 14px;
        font-weight: 600;

        color: #202124;

        letter-spacing: -0.15px;
      }

      .loader_text small {
        margin-top: 3px;
        font-size: 12px;
        font-weight: 400;
        color: #777;
        letter-spacing: 0.1px;
      }

      .icono_succes {
        border-radius: 50%;
        background-color: #e6fde7;
        display: flex;
        display: none;
        align-items: center;
        justify-content: center;
        margin-bottom: 17px;
      }

      .spinner.ocultar {
        display: none;
      }

      .icono_succes.mostrar {
        display: block;
        pointer-events: auto;
        opacity: 1;
      }

      .icono_succes.succes span {
        font-size: 48px;
        color: var(--colorSucces);
      }

      .icono_succes.error span {
        font-size: 40px;
        color: var(--colorError);
      }

      @keyframes spinnerRotate {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      @keyframes spinnerFade {
        0% {
          opacity: 0.12;
        }

        50% {
          opacity: 1;
        }

        100% {
          opacity: 0.12;
        }
      }

      @keyframes loaderAppear {
        from {
          opacity: 0;
          transform: scale(0.92);
        }

        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }

        .spinner span {
          animation: none;
          opacity: 0.7;
        }

        .loader,
        .cont_loader {
          transition: none;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="contenedor_main">
      <div class="loader">
        <div class="cont_loader">
          <div class="loader_box">
            <div class="icono_succes">
              <span class="material-symbols-outlined"> check_circle </span>
            </div>
            <div class="spinner">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>

            <div class="loader_text">
              <strong>Verificando acceso...</strong>
              <small>Espere un momento...</small>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      const loader = document.querySelector(".loader");
      const iconoSucces = document.querySelector(".icono_succes");
      const icono = document.querySelector(".icono_succes span");
      const spinner = document.querySelector(".spinner");
      const loaderText = document.querySelector(".loader_text");

      let iconos = { succes: "check_circle", error: "error" };

      setTimeout(() => {
        const accesoValido = true;

        if (accesoValido) {
          spinner.classList.add("ocultar");
          iconoSucces.classList.add("mostrar", "succes");
          loaderText.innerHTML =
            "<strong>Acceso verificado</strong><small>Redirigiendo...</small>";
          icono.textContent = iconos.succes;
        } else {
          spinner.classList.add("ocultar");
          iconoSucces.classList.add("mostrar", "error");
          loaderText.innerHTML =
            "<strong>Error de acceso</strong><small>Inténtalo nuevamente.</small>";
          icono.textContent = iconos.error;
        }
      }, 3000); // Simulación de 3 segundos de espera
    </script>
  </body>
</html>
